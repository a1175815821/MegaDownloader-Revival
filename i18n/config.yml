# =============================================================================
# MegaDownloader Revival — 文档多语言配置
# =============================================================================
# 这个文件是整套多语言文档体系的唯一事实来源(single source of truth)。
# 想加一门语言 / 加一个文档，改这里就行，GitHub Actions 会自动跟上。
#
# 维护模型(重要):
#   1. 你只用维护中文源文件(下面 documents[].source 指向的文件)
#      —— 中文源本身就是「简体中文版」，不再额外生成 zh-CN 产物
#   2. 推送到 main 后，工作流 i18n.yml 自动把中文翻译成英文 + 所有目标语言
#   3. 英文产物是「仓库门面」：README.md 是英文的，GitHub 首页直接显示英文
#   4. 其他语言全部由 CI 生成，不要手动改，下次同步会被覆盖
#
# 加一门语言: 在 languages 下加一段即可(需要 3 个字段: code / name / flag)
# 加一个文档: 在 documents 下加一段，指好 source 与 outputs
# =============================================================================

# -----------------------------------------------------------------------------
# 术语表文件(LLM 翻译时作为约束注入，保证 "MEGA" "ELC" "Stegano" 等不被乱译)
# -----------------------------------------------------------------------------
glossary: i18n/glossary.yml

# -----------------------------------------------------------------------------
# 权威源语言
# -----------------------------------------------------------------------------
# 人工维护的语言。它不参与翻译循环(不需要「翻译成自己」)，
# 产物清单里也不包含它 —— 源文件本身就是该语言的成品。
source_lang: zh-CN

# -----------------------------------------------------------------------------
# 目标语言
# -----------------------------------------------------------------------------
# 这里列的都是「由 CI 从中文源翻译生成」的语言，**不含 source_lang**。
# code: BCP 47 语言标签，同时用作文件名后缀(README.zh-TW.md)
# name: 该语言的自称(写「繁體中文」这类自称，方便读者一眼认出)
# flag: 语言导航条上显示的旗帜 emoji
languages:
  - code: zh-TW
    name: 繁體中文
    flag: "🇹🇼"
  - code: ja-JP
    name: 日本語
    flag: "🇯🇵"
  - code: ko-KR
    name: 한국어
    flag: "🇰🇷"

# -----------------------------------------------------------------------------
# 需要多语言化的文档
# -----------------------------------------------------------------------------
# 每个文档三段:
#   id      内部标识，用于日志与缓存 key
#   source  人工维护的中文源文件(必须存在，CI 从它翻译)
#   outputs 产物路径模板，{lang} 会被替换成语言代码
#
# 顺序很重要：README 必须放在第一个，因为它要参与语言导航条的生成。
documents:
  - id: readme
    source: docs/README.zh-CN.md           # 中文源 = 简体中文成品
    outputs:
      en: README.md                        # 英文是仓库门面，不带后缀
      lang: README.{lang}.md               # 其他语言带后缀
    # 参与语言导航条(在其他文档里不生成导航，避免噪音)
    lang_nav: true

  - id: changelog
    source: docs/CHANGELOG.zh-CN.md
    outputs:
      en: docs/CHANGELOG.md
      lang: docs/CHANGELOG.{lang}.md
    lang_nav: false

  - id: contributing
    source: docs/CONTRIBUTING.zh-CN.md
    outputs:
      en: docs/CONTRIBUTING.md
      lang: docs/CONTRIBUTING.{lang}.md
    lang_nav: false

# -----------------------------------------------------------------------------
# 翻译行为
# -----------------------------------------------------------------------------
translate:
  # 一次请求最多塞多少字符的中文。太大容易被截断，太小浪费调用次数。
  # 12000 字符约对应 3000~4000 tokens 输入，主流模型都能稳吃下。
  chunk_chars: 12000

  # 失败重试次数(网络抖动 / 限流)
  max_retries: 3

  # 重试间隔基数(秒)，实际等待 = base * 2^attempt，指数退避
  retry_base_seconds: 5

  # 并发翻译的语言数。太多会被服务商限流，保持保守。
  max_parallel_langs: 3

  # 温度。翻译任务要确定性，给 0.2 防止自由发挥。
  temperature: 0.2

# -----------------------------------------------------------------------------
# 语言导航条的文案(每种语言各自本地化，不交给 LLM 翻，避免每次飘)
# -----------------------------------------------------------------------------
# 占位符对应各语言产物的相对路径；{zh-CN} 指向中文源文件本身(即简体中文成品)。
nav:
  zh-CN: "**语言**：[English]({en}) · **简体中文** · [繁體中文]({zh-TW}) · [日本語]({ja-JP}) · [한국어]({ko-KR})"
  zh-TW: "**語言**：[English]({en}) · [简体中文]({zh-CN}) · **繁體中文** · [日本語]({ja-JP}) · [한국어]({ko-KR})"
  ja-JP: "**言語**：[English]({en}) · [简体中文]({zh-CN}) · [繁體中文]({zh-TW}) · **日本語** · [한국어]({ko-KR})"
  ko-KR: "**언어**：[English]({en}) · [简体中文]({zh-CN}) · [繁體中文]({zh-TW}) · [日本語]({ja-JP}) · **한국어**"
  en:    "**Languages**: **English** · [简体中文]({zh-CN}) · [繁體中文]({zh-TW}) · [日本語]({ja-JP}) · [한국어]({ko-KR})"
