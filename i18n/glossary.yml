# =============================================================================
# 术语表 —— 让 LLM 别把专有名词翻译坏
# =============================================================================
# 这个文件在两个地方起作用:
#   1. keep_verbatim 的词会被强制原样保留(不翻译、不音译、不加空格)
#   2. preferred 是「希望这么译」的映射，LLM 会优先采用
#
# 加词规则:
#   - 产品名、协议名、代码标识符、文件扩展名 → keep_verbatim
#   - 有约定俗成译法且你希望统一的技术词 → preferred
# =============================================================================

# -----------------------------------------------------------------------------
# 必须原样保留(不翻译)
# -----------------------------------------------------------------------------
keep_verbatim:
  # 产品与项目
  - MegaDownloader
  - MegaDownloader Revival
  - MegaSearchDesktop
  - MegaSearch Desktop
  - MEGA            # 网盘服务名，永远大写
  - ELC             # Encrypted Link Container
  - Stegano
  - VLC
  - 7-Zip
  - 7zr.exe
  - mpress

  # 技术名词 / 协议
  - MetaMAC
  - PathGuard
  - ThrottledStream
  - ObjectListView
  - SharpCompress
  - BouncyCastle
  - Newtonsoft.Json
  - HttpServer
  - WinForms
  - VB.NET
  - .NET Framework
  - MSBuild
  - GitHub Actions

  # 代码标识符与文件名(避免 LLM "顺手翻译"成自然语言)
  - MegaQuotaManager
  - FileDownloader
  - MegaFolderHelper
  - URLExtractor
  - URLProcessor
  - Conexion
  - Configuracion
  - Fichero
  - ConfiguracionUI
  - ThemeManager
  - LibraryElement
  - StreamingLibrary
  - StreamingLibraryManager
  - ApplicationInstanceManager
  - MegaURIProtocol
  - ELCAccountControl
  - SteganoManager
  - RenamePartToReal
  - ExtractKeyFromK
  - CreateDecryptor
  - LoadDLLFromStream
  - EnsureCsrf
  - ResetearErrores
  - ResetearErroresMigratedV25
  - ComprobandoMD5
  - Descomprimiendo
  - Verificando
  - EnCola
  - Completado
  - EsErrorPermanente
  - ControlRemotoAgregarLinks
  - UpdateSkipVersion
  - VERSION_MEGADOWNLOADER
  - VERSION_UPDATE
  - InternalConfig.xml
  - Configuration.xml
  - MegaDownloader.exe
  - MegaDownloader.sln
  - MegaDownloader.vbproj
  - AssemblyInfo.vb
  - version.xml
  - app.manifest

  # 链接格式示例一律保留
  - mega.nz
  - mega.co.nz
  - mega://

  # 库/工具名
  - xunit
  - F5Lib
  - Fadd
  - WiX

# -----------------------------------------------------------------------------
# 偏好译法(按语言给出，让术语在每门语言里保持一致)
# -----------------------------------------------------------------------------
# 注意: 只约束「有歧义、容易翻飘」的词。普通词汇不用写，交给 LLM 按上下文处理。
preferred:
  clipboard:
