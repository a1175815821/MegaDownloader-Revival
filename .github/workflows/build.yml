name: Build and Release

# =============================================================
# MegaDownloader Revival - GitHub Actions 自动构建工作流
# =============================================================
# 触发条件:
#   1. 推送到 main / master 分支:构建 Release 产物,保存为 artifact
#   2. 推送 v* 标签:构建 Release 产物,创建 GitHub Release 并上传 exe
# =============================================================

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:   # 支持手动触发

jobs:
  build:
    name: Build MegaDownloader
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 完整历史,便于生成 changelog

      # 2. 安装 MSBuild (Visual Studio Build Tools)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3. 安装 NuGet
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: 'latest'

      # 4. 还原 .NET Framework 4.8 引用包
      - name: Restore .NET Framework 4.8 Developer Pack
        shell: pwsh
        run: |
          # .NET Framework 4.8 SDK 已预装于 windows-latest runner
          # 此处仅打印版本以便排错
          Write-Host "MSBuild version:"
          msbuild -version
          Write-Host "Installed .NET Frameworks:"
          Get-ChildItem 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework' -ErrorAction SilentlyContinue | Select-Object Name

      # 5. 构建项目 (Release 配置)
      - name: Build solution (Release)
        run: msbuild MegaDownloader.sln /p:Configuration=Release /p:Platform=x86 /m /v:minimal /nr:false

      - name: Package and verify release assets
        shell: powershell
        run: .\Tests\Stage-ReleaseAssets.ps1 -TestStartup

      # 7. 上传构建产物 (任一触发都执行)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MegaDownloader-Revival-build
          path: |
            artifacts/MegaDownloader.exe
            artifacts/MegaDownloader-Revival-win-x86.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')   # 仅 tag 触发
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 创建 Release 所需权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 下载上一步构建的产物
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MegaDownloader-Revival-build
          path: artifacts

      # 显示产物信息
      - name: List artifacts
        run: ls -la artifacts/

      # 上传同一份 EXE 的单文件版和便携 ZIP。ZIP 附带运行配置和 SDK 许可证。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true    # 由 GitHub 自动生成，可在 Release 页面编辑
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}   # v2.7.0-rc.1 等预发布标签
          overwrite_files: true           # 重发同一 tag(热修复强推)时覆盖同名资产
          files: |
            artifacts/MegaDownloader-Revival-win-x86.zip
            artifacts/MegaDownloader.exe
