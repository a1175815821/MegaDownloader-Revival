name: Feature request
description: Suggest a capability or an improvement to an existing one.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing, check the [CHANGELOG](https://github.com/a1175815821/MegaDownloader-Revival/blob/main/docs/CHANGELOG.md) — 2.6 added search, scheduling, batch pre-flight and a rebuilt workbench, so the feature may already exist.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. "I download 200-file shares and lose track of what I selected" is more useful than "add a counter".
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools, workarounds, or existing settings that come close.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Download engine
        - Adding links / pre-flight
        - Workbench / interface
        - Scheduling
        - Web interface
        - Extraction
        - Languages
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the CHANGELOG for this idea
          required: true
        - label: This request is about MegaDownloader itself, not about MEGA's service or quotas
          required: true
